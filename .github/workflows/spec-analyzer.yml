# Analyzes whether the code correctly implements SPEC.md
# Powered by the reusable ci-spec-agent action.
# Uses GitHub Models (free, no API key needed).

name: "Spec Compliance Check"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-spec:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      models: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run spec compliance check
        uses: khiladiKumar88/ci-spec-agent@v1
        with:
          mode: spec-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
