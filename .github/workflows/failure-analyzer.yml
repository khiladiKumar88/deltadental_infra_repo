# Analyzes any failed workflow and suggests fixes using AI.
# Powered by the reusable ci-spec-agent action.
# Triggers automatically when any workflow fails.

name: "Failure Analyzer"

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      models: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Analyze failure
        uses: khiladiKumar88/ci-spec-agent@v1
        with:
          mode: failure-analyze
          failed-run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
