# Auto-Fix: Reads AI suggestions from the last failed Spec Compliance Check,
# generates fixed code, and creates a Pull Request.
# Powered by the reusable ci-spec-agent action.
# Triggered manually via the "Run workflow" button in Actions tab.

name: "Auto-Fix (AI)"

on:
  workflow_dispatch:

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      models: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run auto-fix
        uses: khiladiKumar88/ci-spec-agent@v1
        with:
          mode: auto-fix
          github-token: ${{ secrets.GITHUB_TOKEN }}
