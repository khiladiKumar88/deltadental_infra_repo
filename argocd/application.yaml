```yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd   # ⚠️ always argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Gaurav666999/deltadental_infra_repo
    targetRevision: HEAD
    path: app/manifest   # ✅ correct path

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd   # corrected namespace to argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
```